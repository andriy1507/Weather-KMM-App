name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI builds are never distributed and tests use a mock HTTP engine, so the real key is not needed
  # (and is not exposed to pull requests).
  OPEN_WEATHER_API_KEY: ci-placeholder

jobs:
  android:
    name: Shared tests + Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Test, lint and build
        run: ./gradlew :sharedLogic:testAndroidHostTest :androidApp:lintDebug :androidApp:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            sharedLogic/build/reports/
            androidApp/build/reports/

  ios:
    name: Shared tests (iOS) + iOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run shared tests on iOS simulator
        run: ./gradlew :sharedLogic:iosSimulatorArm64Test

      # The Xcode build phase builds the Kotlin framework through Gradle.
      # arm64 only: the shared module has no iosX64 target.
      - name: Build iOS app for simulator
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: sharedLogic/build/reports/
